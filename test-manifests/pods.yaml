  name: pod1
  namespace: test
  labels:
    app: pod1
spec:
  nodeSelector:
    kubernetes.io/hostname: cni-testing-worker
  containers:
    - name: busybox
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sleep", "10800"]

